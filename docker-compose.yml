name: llm-chatbot

services:
  backend:
    build:
      context: ./backend
    image: llm-chatbot-backend:local
    env_file:
      - path: .env
        required: false
    environment:
      # inside the container the database always lives on the named volume
      DATABASE_URL: sqlite:////data/app.db
      PORT: "8000"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      ENABLE_FAILURE_SIMULATION: ${ENABLE_FAILURE_SIMULATION:-true}
    ports:
      - "8000:8000"
    volumes:
      - app-data:/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    image: llm-chatbot-frontend:local
    environment:
      # the browser calls the backend directly, so this is the host-visible URL
      API_BASE_URL: ${FRONTEND_API_BASE_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  app-data:
